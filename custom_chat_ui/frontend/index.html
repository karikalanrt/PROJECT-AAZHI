<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude-like Chat Input</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            background-color: transparent;
            /* Important to set transparent so it blends with Streamlit background */
        }
        
        .chat-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            background-color: #212121; /* Dark theme matching Claude/Aazhi */
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            padding: 8px 12px;
            box-sizing: border-box;
            position: relative;
        }

        .chat-container:focus-within {
            border-color: #555;
        }

        .file-preview-area {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        
        .file-badge {
            background-color: #333;
            color: #ddd;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .file-badge .remove-file {
            cursor: pointer;
            font-weight: bold;
            color: #ff5555;
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            width: 100%;
        }

        .plus-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            transition: background 0.2s, color 0.2s;
            margin-bottom: 2px;
        }

        .plus-btn:hover {
            background-color: #333;
            color: #fff;
        }

        textarea {
            flex-grow: 1;
            background: none;
            border: none;
            color: #fff;
            font-size: 15px;
            resize: none;
            outline: none;
            padding: 8px 0;
            line-height: 1.4;
            max-height: 200px;
            min-height: 24px;
            overflow-y: auto;
        }
        
        textarea::placeholder {
            color: #888;
        }

        .send-btn {
            background-color: #fff;
            border: none;
            color: #000;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            transition: opacity 0.2s, background 0.2s;
            margin-bottom: 2px;
        }
        
        .send-btn:hover {
            background-color: #e0e0e0;
        }

        .send-btn:disabled {
            background-color: #444;
            color: #777;
            cursor: not-allowed;
        }

        .upload-mode-select {
            background-color: #1e1e1e;
            color: #ddd;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            height: 32px;
            margin-bottom: 2px;
        }
        
        .upload-mode-select:hover {
            background-color: #333;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>
    <div class="chat-container" id="chatContainer">
        <div class="file-preview-area" id="filePreviewArea"></div>
        <div class="input-row">
            <button class="plus-btn" id="plusBtn" title="Attach files">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
            <select id="uploadMode" class="upload-mode-select" title="Upload Mode">
                <option value="Single Image">🖼️ Single Image</option>
                <option value="Cross-modal Pair">🔄 Cross-modal Pair</option>
                <option value="Bi-temporal Pair">⏳ Bi-temporal Pair</option>
            </select>
            <textarea id="chatInput" placeholder="Message SatQuery AI..." rows="1"></textarea>
            <input type="file" id="fileInput" multiple>
            <button class="send-btn" id="sendBtn" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // --- Streamlit Component Boilerplate ---
        function sendMessageToStreamlitClient(type, data) {
            const outData = Object.assign({
                isStreamlitMessage: true,
                type: type,
            }, data)
            window.parent.postMessage(outData, "*")
        }

        function init() {
            sendMessageToStreamlitClient("streamlit:componentReady", {apiVersion: 1})
        }

        function setFrameHeight() {
            const height = document.body.scrollHeight;
            sendMessageToStreamlitClient("streamlit:setFrameHeight", {height: height + 10})
        }

        function sendDataToPython(data) {
            sendMessageToStreamlitClient("streamlit:setComponentValue", {value: data})
        }

        window.addEventListener("message", function(event) {
            if (event.data.type === "streamlit:render") {
                setFrameHeight()
            }
        })

        window.onload = function() {
            init()
            setFrameHeight()
        }

        // --- Chat UI Logic ---
        const textarea = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const plusBtn = document.getElementById('plusBtn');
        const fileInput = document.getElementById('fileInput');
        const filePreviewArea = document.getElementById('filePreviewArea');

        let attachedFiles = [];

        // Auto-resize textarea
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            updateSendButtonState();
            setFrameHeight();
        });

        // Trigger file input
        plusBtn.addEventListener('click', () => {
            fileInput.click();
        });

        // Handle file selection
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    attachedFiles.push({
                        name: file.name,
                        type: file.type,
                        size: file.size,
                        data: event.target.result // base64 string
                    });
                    renderFilePreviews();
                    updateSendButtonState();
                };
                reader.readAsDataURL(file);
            });
            fileInput.value = ''; // reset
        });

        function renderFilePreviews() {
            filePreviewArea.innerHTML = '';
            attachedFiles.forEach((file, index) => {
                const badge = document.createElement('div');
                badge.className = 'file-badge';
                badge.innerHTML = `
                    <span>${file.name}</span>
                    <span class="remove-file" onclick="removeFile(${index})">×</span>
                `;
                filePreviewArea.appendChild(badge);
            });
            setFrameHeight();
        }

        window.removeFile = function(index) {
            attachedFiles.splice(index, 1);
            renderFilePreviews();
            updateSendButtonState();
        }

        function updateSendButtonState() {
            if (textarea.value.trim() !== '' || attachedFiles.length > 0) {
                sendBtn.disabled = false;
            } else {
                sendBtn.disabled = true;
            }
        }

        // Handle Send
        function submitMessage() {
            const text = textarea.value.trim();
            if (text === '' && attachedFiles.length === 0) return;

            const uploadMode = document.getElementById('uploadMode').value;

            // Send payload to Python
            sendDataToPython({
                text: text,
                files: attachedFiles,
                upload_mode: uploadMode
            });

            // Reset UI
            textarea.value = '';
            textarea.style.height = 'auto';
            attachedFiles = [];
            renderFilePreviews();
            updateSendButtonState();
            setFrameHeight();
        }

        sendBtn.addEventListener('click', submitMessage);

        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitMessage();
            }
        });
    </script>
</body>
</html>
